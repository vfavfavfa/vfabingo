<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All-Hands Bingo</title>
<style>
  :root{
    --bg:#121417;
    --panel:#1b1f24;
    --tile:#22272e;
    --tile-hover:#2b323b;
    --marked:#1f6f5c;
    --marked-2:#2a8d76;
    --accent:#e8b33c;
    --text:#e9edf2;
    --muted:#8d98a6;
    --line:#333b45;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px 16px 48px;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{text-align:center;margin-bottom:18px;max-width:720px;}
  h1{
    margin:0;
    font-size:clamp(24px,4vw,36px);
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:800;
  }
  h1 span{color:var(--accent);}
  .sub{margin:8px 0 0;color:var(--muted);font-size:14px;letter-spacing:.04em;}

  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 20px;
  }
  button{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 18px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
    transition:.15s;
  }
  button:hover{background:var(--tile-hover);border-color:var(--accent);color:var(--accent);}

  .board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    width:min(92vw,720px);
    aspect-ratio:1/1;
  }
  .cell{
    position:relative;
    background:var(--tile);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:clamp(10px,1.55vw,14px);
    line-height:1.3;
    font-weight:500;
    cursor:pointer;
    user-select:none;
    transition:background .15s, transform .1s, border-color .15s;
    overflow:hidden;
  }
  .cell:hover{background:var(--tile-hover);}
  .cell:active{transform:scale(.98);}
  .cell.marked{
    background:linear-gradient(145deg,var(--marked),var(--marked-2));
    border-color:var(--marked-2);
    color:#fff;
  }
  .cell.marked::after{
    content:"";
    position:absolute;inset:0;
    background:
      linear-gradient(to top right,transparent calc(50% - 1px),rgba(255,255,255,.35) 50%,transparent calc(50% + 1px)),
      linear-gradient(to top left,transparent calc(50% - 1px),rgba(255,255,255,.35) 50%,transparent calc(50% + 1px));
    pointer-events:none;
  }
  .cell.free{
    background:#2d2a1e;
    border-color:var(--accent);
    color:var(--accent);
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .cell.free.marked{
    background:linear-gradient(145deg,var(--marked),var(--marked-2));
    color:#fff;
    border-color:var(--marked-2);
  }

  .status{
    margin-top:18px;
    min-height:30px;
    font-size:15px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
  }
  .status.win{color:var(--accent);animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  footer{margin-top:14px;color:var(--muted);font-size:12px;text-align:center;max-width:620px;line-height:1.6;}

  @media print{
    body{background:#fff;color:#000;padding:0;}
    .toolbar,footer{display:none;}
    .cell{background:#fff;border:1.5px solid #000;color:#000;}
    .cell.free{background:#fff;color:#000;}
    .cell.marked{background:#ddd;color:#000;}
    .cell.marked::after{display:none;}
    h1 span{color:#000;}
  }
</style>
</head>
<body>

<header>
  <h1>All-Hands <span>Bingo</span></h1>
  <p class="sub">Click a square when it happens. Four in a row wins.</p>
</header>

<div class="toolbar">
  <button id="shuffle">New card</button>
  <button id="reset">Clear marks</button>
  <button id="print">Print</button>
</div>

<div class="board" id="board"></div>

<div class="status" id="status"></div>

<footer>
  16 squares, no free space. Hit <em>New card</em> so everyone's grid is different.
</footer>

<script>
  const ITEMS = [
    "Forgot to unmute",
    "Sharing isn't working",
    "Capture One not working",
    "Viktor got volunteered to host sprint review",
    "Jens doing fun stuff while presenting",
    "Acronym used that no one understands",
    "Fruit gif in the chat",
    'Someone mentions "AI"',
    'The word "Beta" said 5 times',
    "Sub-30s feature demo",
    "Amazing event photo making everyone who wasn't there jealous",
    "A typo in someone's presentation",
    "Kickass new feature shown",
    'Someone mentions "XYZ before GTA VI released"',
    "Presenters are staying on time",
    "Kostas asks when do we ship it?"
  ];

  const board  = document.getElementById('board');
  const status = document.getElementById('status');
  let marked = new Set();

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function render(order){
    board.innerHTML = '';
    order.forEach((text,i)=>{
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = text;
      cell.dataset.index = i;
      if(marked.has(i)) cell.classList.add('marked');
      cell.addEventListener('click',()=>{
        if(marked.has(i)) marked.delete(i); else marked.add(i);
        cell.classList.toggle('marked');
        checkWin();
      });
      board.appendChild(cell);
    });
    checkWin();
  }

  function checkWin(){
    const lines = [];
    for(let r=0;r<4;r++) lines.push([0,1,2,3].map(c=>r*4+c));
    for(let c=0;c<4;c++) lines.push([0,1,2,3].map(r=>r*4+c));
    lines.push([0,5,10,15]);
    lines.push([3,6,9,12]);

    const hit = lines.filter(l=>l.every(i=>marked.has(i))).length;
    const full = marked.size === 16;

    if(full){
      status.textContent = 'Blackout. Touch grass.';
      status.className = 'status win';
    } else if(hit){
      status.textContent = hit > 1 ? `Bingo ×${hit}` : 'Bingo!';
      status.className = 'status win';
    } else {
      status.textContent = `${marked.size} / 16 marked`;
      status.className = 'status';
    }
  }

  let current = shuffle(ITEMS);

  document.getElementById('shuffle').addEventListener('click',()=>{
    marked = new Set();
    current = shuffle(ITEMS);
    render(current);
  });
  document.getElementById('reset').addEventListener('click',()=>{
    marked = new Set();
    render(current);
  });
  document.getElementById('print').addEventListener('click',()=>window.print());

  render(current);
</script>

</body>
</html>
